<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Fenestra This PC — "unlocked encrypted disk" mark: open padlock, grey body, blue bands. naykkalak (2026) for Fenestra This PC. SPDX-License-Identifier: GPL-3.0-or-later -->
  <defs>
    <linearGradient id="bande" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f95e6"/>
      <stop offset="1" stop-color="#2a78c8"/>
    </linearGradient>
    <linearGradient id="anse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8e9aa5"/>
      <stop offset="0.5" stop-color="#b4bcc4"/>
      <stop offset="1" stop-color="#8e9aa5"/>
    </linearGradient>
    <clipPath id="c"><rect x="10.5" y="25" width="43" height="36" rx="1.6"/></clipPath>
  </defs>
  <!-- open shackle: left leg in the body, right leg free -->
  <path d="M22.5 28 V15.2 a10.6 10.6 0 0 1 21.2 0 V19.6" fill="none" stroke="#56626e" stroke-width="6.8" stroke-linecap="butt"/>
  <path d="M22.5 28 V15.2 a10.6 10.6 0 0 1 21.2 0 V19.6" fill="none" stroke="url(#anse)" stroke-width="5.2" stroke-linecap="butt"/>
  <!-- body: blue band on top, grey, blue band at the bottom -->
  <g clip-path="url(#c)">
    <rect x="10.5" y="25" width="43" height="36" fill="#a2abb4"/>
    <rect x="10.5" y="25" width="43" height="6" fill="url(#bande)"/>
    <rect x="10.5" y="55" width="43" height="6" fill="url(#bande)"/>
  </g>
  <rect x="10.5" y="25" width="43" height="36" rx="1.6" fill="none" stroke="#56626e" stroke-width="1.3"/>
</svg>
